<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>គេហទំព័ររបស់ខ្ញុំ</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #1e293b;
      padding: 32px 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      border: 1px solid #334155;
    }
    .profile-img {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      transition: 0.2s;
    }
    .btn:hover {
      background: #0284c7;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="profile-img">🚀</div>
    <h1>សួស្តីពិភពលោក!</h1>
    <p>នេះជាគេហទំព័រដំបូងរបស់ខ្ញុំដែលបានបង្កើត និងបង្ហោះដោយជោគជ័យនៅលើ Vercel។</p>
    <a href="#" class="btn">ស្វែងយល់បន្ថែម</a>
  </div>

</body>
</html>
